<style>
#demo{background:#0b1410;color:#fff;font:13px/1.5 system-ui,sans-serif;padding:8px 14px;display:flex;flex-wrap:wrap;gap:4px 16px;align-items:center}
#demo b{color:#7bd45f}#demo a{color:#fff;text-decoration:underline;margin-right:4px}
#demo button{background:none;border:1px solid #fff;color:#fff;border-radius:6px;padding:2px 10px;font-size:12px;cursor:pointer;min-height:0}

<body>
<div id="demo">
  <span class="g"><b>DEMO</b> — sample data, stored only in your browser (nothing is shared or sent anywhere).

  <span>Sign in as: <a href="?as=customer">Customer</a><a href="?as=delivery">Delivery</a><a href="?as=admin">Admin</a></span>
  <button onclick="__demoReset()">Reset demo</button>
</div>
<header hidden>
  <button id="menu" aria-label="Menu">☰</button>
  <div class="brand"><img class="logo" src="logo.png" alt=""> GRV Dairy <span id="who" class="tag"></span></div>
  <nav id="nav"></nav>

</header>
<main id="view"></main>
<div id="toast"></div>
<dialog id="dlg"></dialog>
